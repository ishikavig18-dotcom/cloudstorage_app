<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cloud File Storage</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:
            linear-gradient(
                135deg,
                #0f172a,
                #1e293b,
                #312e81
            );

            padding:20px;

        }

        .card{

            width:420px;

            background:
            rgba(255,255,255,0.08);

            backdrop-filter:blur(20px);

            border:1px solid
            rgba(255,255,255,0.15);

            border-radius:25px;

            padding:50px 40px;

            text-align:center;

            box-shadow:
            0 25px 50px
            rgba(0,0,0,0.3);

        }

        .logo{

            font-size:70px;

            margin-bottom:15px;

        }

        h1{

            color:white;

            margin-bottom:15px;

            font-size:34px;

        }

        .subtitle{

            color:#cbd5e1;

            margin-bottom:35px;

            line-height:1.6;

        }

        .login-btn{

            display:inline-block;

            text-decoration:none;

            color:white;

            padding:15px 30px;

            border-radius:14px;

            font-weight:600;

            background:
            linear-gradient(
                135deg,
                #4285F4,
                #2563eb
            );

            transition:.3s;

            box-shadow:
            0 10px 25px
            rgba(66,133,244,0.35);

        }

        .login-btn:hover{

            transform:
            translateY(-3px);

            box-shadow:
            0 15px 30px
            rgba(66,133,244,0.45);

        }

        .features{

            margin-top:35px;

            text-align:left;

            color:#e2e8f0;

            line-height:2;

            font-size:14px;

        }

        .footer{

            margin-top:30px;

            color:#94a3b8;

            font-size:13px;

        }

        @media(max-width:500px){

            .card{
                width:100%;
                padding:40px 25px;
            }

            h1{
                font-size:28px;
            }

        }

    </style>

</head>

<body>

    <div class="card">

        <div class="logo">
            ☁️
        </div>

        <h1>
            Cloud File Storage
        </h1>

        <p class="subtitle">

            Securely upload, manage, share,
            download and organize your files
            using AWS S3 cloud storage.

        </p>

        <a href="/login"
           class="login-btn">

            Continue with Google

        </a>

        <div class="features">

            ✓ Secure Google Authentication<br>

            ✓ AWS S3 Cloud Storage<br>

            ✓ Fast File Uploads<br>

            ✓ Download & Share Files<br>

            ✓ Bucket Versioning Support

        </div>

        <div class="footer">

            Developed by Ishika Vig

        </div>

    </div>

</body>

</html>
